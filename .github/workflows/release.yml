name: Wydanie (instalatory Windows i macOS)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: "", rclone: windows-amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, rclone: osx-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, rclone: osx-amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: rclone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile r.zip
          Expand-Archive r.zip -DestinationPath rc
          Copy-Item (Get-ChildItem rc -Recurse -Filter rclone.exe | Select-Object -First 1).FullName app/src-tauri/bin/rclone.exe
      - name: rclone (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL "https://downloads.rclone.org/rclone-current-${{ matrix.rclone }}.zip" -o r.zip
          unzip -q r.zip -d rc
          cp "$(find rc -name rclone -type f | head -1)" app/src-tauri/bin/rclone
          chmod +x app/src-tauri/bin/rclone
      - name: Podpis Windows (certyfikat z sekretów, jeśli podano)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "Brak sekretu WINDOWS_CERTIFICATE: instalator nie zostanie podpisany."; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw | Out-Null
          $thumb = (Get-PfxCertificate -FilePath cert.pfx -Password $pw).Thumbprint
          $path = "app/src-tauri/tauri.conf.json"
          $conf = Get-Content $path -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $thumb -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8
          Remove-Item cert.pfx
          Write-Host "Podpis Windows włączony."
      - name: Podpis i notaryzacja macOS (jeśli podano sekrety)
        if: runner.os == 'macOS'
        env:
          S_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_ID: ${{ secrets.APPLE_ID }}
          S_PW: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$S_CERT" ]; then echo "Brak sekretu APPLE_CERTIFICATE: aplikacja nie zostanie podpisana."; exit 0; fi
          {
            echo "APPLE_CERTIFICATE=$S_CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$S_CERT_PW"
            echo "APPLE_SIGNING_IDENTITY=$S_IDENTITY"
            echo "APPLE_ID=$S_ID"
            echo "APPLE_PASSWORD=$S_PW"
            echo "APPLE_TEAM_ID=$S_TEAM"
          } >> "$GITHUB_ENV"
          echo "Podpis i notaryzacja macOS włączone."
      - name: Artefakty automatycznych aktualizacji (jeśli podano klucz)
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$UPDATER_KEY" ]; then
            node -e "const f='app/src-tauri/tauri.conf.json',c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=true;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
            echo "Aktualizacje automatyczne włączone."
          else
            echo "Brak sekretu TAURI_SIGNING_PRIVATE_KEY: bez artefaktów aktualizacji."
          fi
      - name: Zależności Node (Tauri CLI)
        working-directory: app
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "SyncPolak v__VERSION__"
          releaseBody: "Instalatory: Windows (.exe/.msi), macOS (.dmg). Podpis zależy od certyfikatów w sekretach repozytorium (SIGNING.md); bez nich system pokaże ostrzeżenie."
          releaseDraft: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
