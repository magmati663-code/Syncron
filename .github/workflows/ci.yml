name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Testy silnika (Windows, macOS, Linux)
        run: cargo test -p syncpolak-core
      - name: Clippy silnika
        run: cargo clippy -p syncpolak-core --all-targets -- -D warnings
