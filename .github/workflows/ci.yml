name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Instalacja rclone (testy ścieżki chmurowej)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) curl -fsSL https://rclone.org/install.sh | sudo bash ;;
            macOS) brew install rclone ;;
            Windows) choco install rclone -y --no-progress ;;
          esac || echo "::warning::nie udało się zainstalować rclone: testy rclone zostaną pominięte"
          rclone version || true
      - name: Testy silnika (Windows, macOS, Linux)
        run: cargo test -p syncpolak-core -- --nocapture --test-threads=1
      - name: Clippy silnika
        run: cargo clippy -p syncpolak-core --all-targets -- -D warnings
