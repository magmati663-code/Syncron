[package]
name = "syncron-core"
version = "0.7.5"
edition = "2021"

[dependencies]
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
filetime = "0.2"
log = "0.4"
anyhow = "1"
blake3 = { version = "1", default-features = false, features = ["std"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }

russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync"] }
quick-xml = "0.42"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"
unicode-normalization = "0.1"
filetime = "0.2"
