[package]
name = "syncron-core"
version = "0.7.5"
edition = "2021"

[dependencies]
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
filetime = "0.2"
log = "0.4"
anyhow = "1"
blake3 = { version = "1", default-features = false, features = ["std"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
chacha20poly1305 = "0.10"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"

[dev-dependencies]
tempfile = "3"
unicode-normalization = "0.1"
filetime = "0.2"
