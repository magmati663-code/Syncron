[package]
name = "syncpolak-app"
version = "0.2.0"
edition = "2021"
description = "SyncPolak: synchronizacja folderów, dysków sieciowych i chmur"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
syncpolak-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
